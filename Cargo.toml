[package]
name = "aplikasi-steganografi"
version = "0.1.0"
edition = "2024"
authors = ["Hafizh Muhammad Hikmatiar"]
description = "Aplikasi desktop steganografi untuk menyisipkan dan membaca pesan tersembunyi pada gambar, audio, dan video"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "clipboard"] }
egui = "0.37"
image = "0.25"
hound = "3.5"
aes = "0.9"
cipher = "0.5"
chacha20poly1305 = "0.11"
argon2 = "0.6"
phc = "0.6"
rand = "0.10"
sha2 = "0.11"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "2.0"
zeroize = "1.8"
rfd = "0.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
